name: iOS Build → AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          PRODUCT_DIR=/tmp/xcode-build/Build/Products/Release-iphoneos
          APP=$(find "$PRODUCT_DIR" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found under $PRODUCT_DIR"
            find /tmp/xcode-build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          echo "App found: $APP"
          rm -rf Payload ShareToObsidian.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload
          ls -lh ShareToObsidian.ipa

      - name: Verify IPA contents
        run: |
          rm -rf ipa-check
          mkdir ipa-check
          unzip -q ShareToObsidian.ipa -d ipa-check
          python3 - <<'PY'
          import glob
          import plistlib
          import sys
          from pathlib import Path

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          apps = list(Path("ipa-check/Payload").glob("*.app"))
          if not apps:
              fail("No app bundle found in IPA Payload.")
          app = apps[0]
          extensions = list((app / "PlugIns").glob("*.appex"))
          if not extensions:
              fail("Share Extension is missing from IPA.")
          extension = extensions[0]

          with (app / "Info.plist").open("rb") as handle:
              app_info = plistlib.load(handle)
          with (extension / "Info.plist").open("rb") as handle:
              extension_info = plistlib.load(handle)

          app_bundle_id = app_info.get("CFBundleIdentifier")
          extension_bundle_id = extension_info.get("CFBundleIdentifier")
          url_scheme = (
              app_info.get("CFBundleURLTypes", [{}])[0]
              .get("CFBundleURLSchemes", [None])[0]
          )
          extension_point = extension_info.get("NSExtension", {}).get("NSExtensionPointIdentifier")

          checks = {
              "app bundle id": (app_bundle_id, "com.hdwei.ShareToObsidian"),
              "extension bundle id": (extension_bundle_id, "com.hdwei.ShareToObsidian.ShareExtension"),
              "pairing URL scheme": (url_scheme, "sharetoobsidian"),
              "extension point": (extension_point, "com.apple.share-services"),
          }
          for label, (actual, expected) in checks.items():
              if actual != expected:
                  fail(f"Unexpected {label}: {actual!r}, expected {expected!r}.")

          print(f"Verified app: {app}")
          print(f"Verified extension: {extension}")
          print("IPA content verification passed.")
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian.ipa
          path: ShareToObsidian.ipa
