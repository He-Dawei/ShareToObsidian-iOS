name: iOS Build → AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  full:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP=$(find /tmp/xcode-build -maxdepth 4 -name "*.app" -type d | grep -v "\.appex" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload && ls -lh ShareToObsidian.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian
          path: ShareToObsidian.ipa

  standalone:
    runs-on: macos-latest
    needs: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate standalone project (no extension)
        run: |
          mkdir -p /tmp/standalone-project
          cd /tmp/standalone-project
          cp "$GITHUB_WORKSPACE/project-standalone.yml" .
          xcodegen generate --spec project-standalone.yml
      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Build standalone (no extension)
        run: |
          xcodebuild clean build \
            -project /tmp/standalone-project/ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-standalone \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP=$(find /tmp/xcode-standalone -maxdepth 4 -name "*.app" -type d | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -r ShareToObsidian-standalone.ipa Payload && ls -lh ShareToObsidian-standalone.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian-standalone
          path: ShareToObsidian-standalone.ipa
