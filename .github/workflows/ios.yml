name: iOS Build → AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          APP=$(find /tmp/xcode-build -name "*.app" -type d | grep -v "\.appex" | head -1)
          echo "App found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload
          ls -lh ShareToObsidian.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian.ipa
          path: ShareToObsidian.ipa
