name: iOS Build -> AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP=$(find /tmp/xcode-build -maxdepth 4 -name "*.app" -type d | grep -v "\.appex" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload && ls -lh ShareToObsidian.ipa
      - name: Verify share extension in IPA
        run: unzip -l ShareToObsidian.ipa | grep -q 'Payload/.*\.app/PlugIns/.*\.appex/Info.plist'
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian
          path: ShareToObsidian.ipa
      - name: Publish full release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete full-latest --yes --cleanup-tag || true
          git tag -f full-latest
          git push origin -f full-latest
          gh release create full-latest ShareToObsidian.ipa \
            --title "ShareToObsidian full latest" \
            --notes "Built from $GITHUB_SHA. Includes Share Extension."

  standalone:
    runs-on: macos-latest
    needs: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate standalone project (no extension)
        run: xcodegen generate --spec project-standalone.yml
      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Build standalone (no extension)
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-standalone \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP=$(find /tmp/xcode-standalone -maxdepth 4 -name "*.app" -type d | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -r ShareToObsidian-standalone.ipa Payload && ls -lh ShareToObsidian-standalone.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian-standalone
          path: ShareToObsidian-standalone.ipa
      - name: Publish standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete standalone-latest --yes --cleanup-tag || true
          git tag -f standalone-latest
          git push origin -f standalone-latest
          gh release create standalone-latest ShareToObsidian-standalone.ipa \
            --title "ShareToObsidian standalone latest" \
            --notes "Built from $GITHUB_SHA"
