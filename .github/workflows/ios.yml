name: iOS Build → AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          PRODUCT_DIR=/tmp/xcode-build/Build/Products/Release-iphoneos
          APP=$(find "$PRODUCT_DIR" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found under $PRODUCT_DIR"
            find /tmp/xcode-build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          echo "App found: $APP"
          rm -rf Payload ShareToObsidian.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload
          ls -lh ShareToObsidian.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian.ipa
          path: ShareToObsidian.ipa
