name: iOS Build → AltStore

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build App + Extension
        run: |
          xcodebuild clean build \
            -project ShareToObsidian.xcodeproj \
            -scheme ShareToObsidian \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/xcode-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          PRODUCT_DIR=/tmp/xcode-build/Build/Products/Release-iphoneos
          APP=$(find "$PRODUCT_DIR" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found under $PRODUCT_DIR"
            find /tmp/xcode-build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          echo "App found: $APP"
          rm -rf Payload ShareToObsidian.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ShareToObsidian.ipa Payload
          ls -lh ShareToObsidian.ipa

      - name: Verify IPA contents
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          read_plist() {
            local key="$1"
            local file="$2"
            local value
            value=$(plutil -extract "$key" raw -o - "$file" 2>&1) || fail "Cannot read $key from $file: $value"
            echo "$value"
          }
          rm -rf ipa-check
          mkdir ipa-check
          unzip -q ShareToObsidian.ipa -d ipa-check
          APP=$(find ipa-check/Payload -maxdepth 1 -name "*.app" -type d -print -quit)
          if [ -z "$APP" ]; then
            echo "No app bundle found in IPA Payload"
            find ipa-check -maxdepth 3 -print
            fail "No app bundle found in IPA Payload"
          fi
          EXTENSION=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -type d -print -quit 2>/dev/null || true)
          if [ -z "$EXTENSION" ]; then
            echo "Share Extension is missing from IPA."
            find "$APP" -maxdepth 3 -print
            fail "Share Extension is missing from IPA."
          fi
          test -f "$APP/Info.plist" || fail "App Info.plist is missing: $APP/Info.plist"
          test -f "$EXTENSION/Info.plist" || fail "Extension Info.plist is missing: $EXTENSION/Info.plist"
          APP_BUNDLE_ID=$(read_plist "CFBundleIdentifier" "$APP/Info.plist")
          EXTENSION_BUNDLE_ID=$(read_plist "CFBundleIdentifier" "$EXTENSION/Info.plist")
          URL_SCHEME=$(read_plist "CFBundleURLTypes.0.CFBundleURLSchemes.0" "$APP/Info.plist")
          EXTENSION_POINT=$(read_plist "NSExtension.NSExtensionPointIdentifier" "$EXTENSION/Info.plist")
          [ "$APP_BUNDLE_ID" = "com.hdwei.ShareToObsidian" ] || fail "Unexpected app bundle id: $APP_BUNDLE_ID"
          [ "$EXTENSION_BUNDLE_ID" = "com.hdwei.ShareToObsidian.ShareExtension" ] || fail "Unexpected extension bundle id: $EXTENSION_BUNDLE_ID"
          [ "$URL_SCHEME" = "sharetoobsidian" ] || fail "Unexpected app pairing URL scheme: $URL_SCHEME"
          [ "$EXTENSION_POINT" = "com.apple.share-services" ] || fail "Unexpected extension point: $EXTENSION_POINT"
          echo "IPA content verification passed."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShareToObsidian.ipa
          path: ShareToObsidian.ipa
